name: PDF generieren

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Release-Datum setzen
        run: |
          echo "RELEASE_TAG=KW$(date +%V)-$(date +%m)-$(date +%Y)-termine-v${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=KW$(date +%V) $(date +%m/%Y) Termine v${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date +%d.%m.%Y)" >> $GITHUB_ENV

      - name: WeasyPrint System-Abhängigkeiten
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - name: Python-Pakete installieren
        run: pip install -r requirements.txt

      - name: PDFs generieren
        run: python src/main.py
        env:
          TERMINE_JSON_URL: https://erfindergeist.org/wp-json/erfindergeist/v2/events

      - name: GitHub Release erstellen und PDFs veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          make_latest: true
          body: |
            Automatisch generierte Terminübersichten für den **Erfindergeist Jülich e.V.**

            Stand: ${{ env.RELEASE_DATE }}

            | Datei | Format | Inhalt |
            |---|---|---|
            | `Verein/terminuebersicht_hoch.pdf` | A4 Hochformat | nächste 7 Termine |
            | `Verein/terminuebersicht_quer.pdf` | A4 Querformat | nächste 5 Termine |
            | `Angebote/Repaircafe/termine_repaircafe_hoch.pdf` | A4 Hochformat | Repair Café — alle Termine |
            | `Angebote/Repaircafe/termine_repaircafe_quer.pdf` | A4 Querformat | Repair Café — alle Termine |
            | `Angebote/Repaircafe/repaircafe_haftungsbegrenzung.pdf` | A4 Querformat | Haftungsbegrenzung Repair Café (2× A5) |
            | `Angebote/Repaircafe/repaircafe_laufzettel.pdf` | A4 Querformat | Laufzettel Repair Café (2× A5) |
            | `Verein/Compliance/datenschutz.pdf` | A4 Hochformat | Datenschutzhinweis Repair Café |
            | `Verein/vereinssatzung.pdf` | A4 Hochformat | Vereinssatzung Erfindergeist Jülich e.V. |
            | `Angebote/Werkstatt/einweisung_werkstatt.pdf` | A4 Hochformat | Einweisungsbestätigung &amp; Haftungsausschluss Offene Werkstatt |
            | `Angebote/Werkstatt/verhaltensregeln.pdf` | A4 Hochformat | Verhaltensregeln Offene Werkstatt |
            | `Verein/Taetigkeitsnachweise/taetigkeitsnachweis_{year}.pdf` | A4 Hochformat | Tätigkeitsnachweis je Geschäftsjahr (aus Vereinschronik) |
          files: |
            output/*.pdf
            output/**/*.pdf

      - name: PDF to share.erfindergeist.org
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: erfindergeist.org
          username: ${{ secrets.FTP_USERNAME_SHARE }}
          password: ${{ secrets.FTP_PASSWORD_SHARE }}
          local-dir: ./output/
          server-dir: /downloads/
          protocol: ftps
          state-name: .ftp-deploy-pdf-termine-state.json
          exclude: |
            **/.gitkeep
